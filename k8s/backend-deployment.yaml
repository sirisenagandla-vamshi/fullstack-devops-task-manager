apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-backend
  template:
    metadata:
      labels:
        app: task-backend
    spec:
      containers:
        - name: task-backend-container
          image: task-backend
          imagePullPolicy: Never
          ports:
            - containerPort: 5000