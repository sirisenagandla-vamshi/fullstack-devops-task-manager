apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-frontend
  template:
    metadata:
      labels:
        app: task-frontend
    spec:
      containers:
        - name: task-frontend-container
          image: task-frontend
          imagePullPolicy: Never
          ports:
            - containerPort: 3000